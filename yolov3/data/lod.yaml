path: ../../datasets  # dataset root dir (contains test_night_1022_1927 and test1_0705_174542)
train: [test_night_1022_1927/train.txt, test1_0705_174542/train.txt]  # RAW DNG paths
val: [test_night_1022_1927/val.txt, test1_0705_174542/val.txt]
test: [test_night_1022_1927/test.txt, test1_0705_174542/test.txt]

nc: 4
names:
  0: person
  1: bicycle
  2: car
  3: motorcycle


